<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="Clean Theme"><text x="16" y="31" class="wire-text wire-text-bold">Clean Theme</text></g><g role="group" aria-label="A modern, minimal design with clean lines and subtle shadows."><text x="16" y="67" class="wire-text">A modern, minimal design with clean lines and subtle shadows.</text></g><g role="group"><line x1="16" y1="88" x2="216" y2="88" stroke="#dee2e6" stroke-width="1" /></g><rect x="16" y="105" width="376" height="184" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Form Example"><text x="32" y="136" class="wire-text wire-text-bold">Form Example</text></g><g role="textbox" aria-label="Enter your name" aria-required="true" aria-placeholder="Enter your name"><g>
      <rect x="32" y="149" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="172" class="wire-text wire-text-secondary">Enter your name</text>
      <text x="220" y="172" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Enter your email" aria-placeholder="Enter your email"><g>
      <rect x="32" y="193" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="216" class="wire-text wire-text-secondary">Enter your email</text>
      
    </g></g><g role="button" aria-label="Submit"><g opacity="1">
