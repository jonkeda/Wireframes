      <text x="190" y="260" text-anchor="middle" class="wire-text" style="fill: #212529">Cancel</text>
    </g></g><rect x="408" y="105" width="376" height="164" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Controls"><text x="424" y="136" class="wire-text wire-text-bold">Controls</text></g><g role="checkbox" aria-label="Remember me" aria-checked="true"><g><rect x="424" y="152" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><path d="M428 161 L432 165 L438 157" stroke="#0d6efd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="450" y="166" class="wire-text">Remember me</text></g></g><g role="checkbox" aria-label="Send notifications" aria-checked="false"><g><rect x="424" y="184" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="450" y="198" class="wire-text">Send notifications</text></g></g><g role="switch" aria-label="Dark mode" aria-checked="false"><g><rect x="424" y="213" width="44" height="24" rx="12" fill="#dee2e6" /><circle cx="436" cy="225" r="10" fill="#ffffff" /><text x="476" y="230" class="wire-text">Dark mode</text></g></g><g role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="424" y="245" width="200" height="8" rx="4" fill="#f8f9fa" />
      <rect x="424" y="245" width="130" height="8" rx="4" fill="#0d6efd" />
    </g></g><g role="group"><line x1="16" y1="305" x2="216" y2="305" stroke="#dee2e6" stroke-width="1" /></g><rect x="16" y="322" width="376" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" /><g role="group" aria-label="Status Badges"><text x="32" y="353" class="wire-text wire-text-bold">Status Badges</text></g><g role="group" aria-label="Active"><g>
      <rect x="32" y="362" width="24" height="24" rx="12" fill="#6c757d" />
