      <text x="108" y="378" text-anchor="middle" class="wire-text wire-text-small" style="fill: #ffffff">Error</text>
    </g></g><rect x="408" y="322" width="376" height="96" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" /><g role="group" aria-label="Navigation"><text x="424" y="353" class="wire-text wire-text-bold">Navigation</text></g><rect x="424" y="362" width="344" height="40" fill="none" stroke="#dee2e6" stroke-width="1" /><g>
      <rect x="424" y="362" width="344" height="40" fill="#f8f9fa" />
      <line x1="424" y1="402" x2="768" y2="402" stroke="#dee2e6" stroke-width="1" />
    </g><g>
