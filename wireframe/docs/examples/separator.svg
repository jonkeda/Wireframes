<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="Separator"><text x="16" y="31" class="wire-text wire-text-bold">Separator</text></g><g role="group" aria-label="Content above separator"><text x="16" y="67" class="wire-text">Content above separator</text></g><g role="group"><line x1="16" y1="80" x2="216" y2="80" stroke="#dee2e6" stroke-width="1" /></g><g role="group" aria-label="Content below separator"><text x="16" y="104" class="wire-text">Content below separator</text></g><g role="group" aria-label="Spacer"><text x="16" y="140" class="wire-text wire-text-bold">Spacer</text></g><g role="group" aria-label="Content above spacer"><text x="16" y="176" class="wire-text">Content above spacer</text></g><g role="group" aria-label="Content below spacer (32px gap)"><text x="16" y="244" class="wire-text">Content below spacer (32px gap)</text></g><g role="group" aria-label="In Horizontal Layout"><text x="16" y="280" class="wire-text wire-text-bold">In Horizontal Layout</text></g><g role="button" aria-label="Left"><g opacity="1">
      <rect x="16" y="301" width="100" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="66" y="324" text-anchor="middle" class="wire-text" style="fill: #212529">Left</text>
    </g></g><g role="button" aria-label="Right (pushed by spacer)"><g opacity="1">
      <rect x="148" y="301" width="224" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="260" y="324" text-anchor="middle" class="wire-text" style="fill: #212529">Right (pushed by spacer)</text>
    </g></g>
</svg>