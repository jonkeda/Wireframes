<svg xmlns="http://www.w3.org/2000/svg" width="232" height="112" viewBox="0 0 232 112" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="textbox" aria-label="Categorie" aria-placeholder="Categorie"><g>
      <rect x="16" y="16" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">Categorie</text>
      
    </g></g><g role="button" aria-label="Overzicht"><g opacity="1">
      <rect x="16" y="60" width="104" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="68" y="83" text-anchor="middle" class="wire-text" style="fill: #212529">Overzicht</text>
    </g></g>
</svg>
