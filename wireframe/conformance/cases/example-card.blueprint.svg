<svg xmlns="http://www.w3.org/2000/svg" width="800" height="824" viewBox="0 0 800 824" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Basic Card"><text x="16" y="31" class="wire-text wire-text-bold">Basic Card</text></g><rect x="16" y="52" width="768" height="52" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="This is a simple card with padding."><text x="32" y="83" class="wire-text">This is a simple card with padding.</text></g><g role="group"><line x1="16" y1="120" x2="216" y2="120" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="Card with Header"><text x="16" y="152" class="wire-text wire-text-bold">Card with Header</text></g><rect x="16" y="173" width="768" height="220" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><rect x="32" y="189" width="736" height="52" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><g role="group" aria-label="Card Title"><text x="48" y="220" class="wire-text wire-text-bold">Card Title</text></g><rect x="32" y="249" width="736" height="52" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><g role="group" aria-label="Card content goes here."><text x="48" y="280" class="wire-text">Card content goes here.</text></g><rect x="32" y="309" width="736" height="68" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="48" y="325" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="98" y="348" text-anchor="middle" class="wire-text" style="fill: #ffffff">Cancel</text>
    </g></g><g role="button" aria-label="Save"><g opacity="1">
      <rect x="156" y="325" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="206" y="348" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Save</text>
    </g></g><g role="group"><line x1="16" y1="409" x2="216" y2="409" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="Product Card"><text x="16" y="441" class="wire-text wire-text-bold">Product Card</text></g><rect x="16" y="462" width="768" height="346" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="img" aria-label="Product Image" aria-placeholder="Product Image"><g>
      <rect x="32" y="478" width="200" height="150" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <line x1="32" y1="478" x2="232" y2="628" stroke="#4a7ab0" stroke-width="1" />
      <line x1="232" y1="478" x2="32" y2="628" stroke="#4a7ab0" stroke-width="1" />
      <text x="132" y="558" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Image</text>
    </g></g><g role="group" aria-label="Product Name"><text x="48" y="667" class="wire-text wire-text-bold">Product Name</text></g><g role="group" aria-label="A great product description"><text x="48" y="695" class="wire-text">A great product description</text></g><g role="group" aria-label="$29.99"><text x="48" y="723" class="wire-text wire-text-bold">$29.99</text></g><g role="group" aria-label="Sale"><g>
      <rect x="136" y="708" width="24" height="24" rx="12" fill="#6c757d" />
      <text x="148" y="724" text-anchor="middle" class="wire-text wire-text-small" style="fill: #1e3a5f">Sale</text>
    </g></g><g role="button" aria-label="Add to Cart"><g opacity="1">
      <rect x="48" y="740" width="120" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="108" y="763" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Add to Cart</text>
    </g></g>
</svg>
