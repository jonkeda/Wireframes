<svg xmlns="http://www.w3.org/2000/svg" width="432" height="184" viewBox="0 0 432 184" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="400" height="152" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Upload Progress"><text x="32" y="47" class="wire-text wire-text-bold">Upload Progress</text></g><g role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="32" y="64" width="200" height="8" rx="4" fill="#2a4a6f" />
      <rect x="32" y="64" width="150" height="8" rx="4" fill="#ffffff" />
    </g></g><g role="group" aria-label="Uploading file... 75%"><text x="32" y="99" class="wire-text">Uploading file... 75%</text></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="116" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="139" text-anchor="middle" class="wire-text" style="fill: #ffffff">Cancel</text>
    </g></g><g role="group" aria-label="3 of 4 files"><text x="304" y="131" class="wire-text">3 of 4 files</text></g>
</svg>
