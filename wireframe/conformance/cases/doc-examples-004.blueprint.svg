<svg xmlns="http://www.w3.org/2000/svg" width="456" height="437" viewBox="0 0 456 437" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="400" height="405" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Create Account"><text x="32" y="47" class="wire-text wire-text-bold">Create Account</text></g><g role="textbox" aria-label="First Name" aria-placeholder="First Name"><g>
      <rect x="32" y="64" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="87" class="wire-text wire-text-secondary">First Name</text>
      
    </g></g><g role="textbox" aria-label="Last Name" aria-placeholder="Last Name"><g>
      <rect x="240" y="64" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="252" y="87" class="wire-text wire-text-secondary">Last Name</text>
      
    </g></g><g role="textbox" aria-label="Email" aria-required="true" aria-placeholder="Email"><g>
      <rect x="32" y="112" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="135" class="wire-text wire-text-secondary">Email</text>
      <text x="220" y="135" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Password" aria-required="true" aria-placeholder="Password"><g>
      <rect x="32" y="160" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="183" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="183" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Confirm Password" aria-required="true" aria-placeholder="Confirm Password"><g>
      <rect x="32" y="208" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="231" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="231" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="checkbox" aria-label="I agree to the Terms of Service" aria-required="true" aria-checked="false"><g><rect x="32" y="259" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="58" y="273" class="wire-text">I agree to the Terms of Service</text></g></g><g role="button" aria-label="Create Account"><g opacity="1">
      <rect x="32" y="292" width="144" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="104" y="315" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Create Account</text>
    </g></g><g role="group"><line x1="32" y1="340" x2="232" y2="340" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="Already have an account?"><text x="32" y="368" class="wire-text">Already have an account?</text></g><g role="group" aria-label="Sign in instead"><text x="32" y="400" class="wire-text">Sign in instead</text></g>
</svg>
