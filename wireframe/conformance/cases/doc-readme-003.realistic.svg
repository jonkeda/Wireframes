  <rect x="16" y="16" width="400" height="240" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g>
          <rect x="32" y="32" width="368" height="52" rx="6" fill="#dc354520" stroke="#dc3545" stroke-width="1" />
