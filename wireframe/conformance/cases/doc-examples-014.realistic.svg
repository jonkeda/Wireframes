<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="768" height="568" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="**Upload Progress**"><text x="32" y="47" class="wire-text wire-text-bold">Upload Progress</text></g><g role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="32" y="64" width="200" height="8" rx="4" fill="#f8f9fa" />
      <rect x="32" y="64" width="150" height="8" rx="4" fill="#0d6efd" />
    </g></g><g role="group" aria-label="Uploading file... 75%"><text x="32" y="99" class="wire-text">Uploading file... 75%</text></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="116" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="139" text-anchor="middle" class="wire-text" fill="#212529">Cancel</text>
    </g></g><g role="group" aria-label="3 of 4 files"><text x="140" y="131" class="wire-text">3 of 4 files</text></g>
