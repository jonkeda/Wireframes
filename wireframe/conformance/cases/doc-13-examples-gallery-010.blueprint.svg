  <rect x="16" y="16" width="500" height="168" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g>
      <rect x="32" y="32" width="96" height="40" fill="transparent" />
      <text x="80" y="57" text-anchor="middle" class="wire-text" style="fill: #a0c4e8">Overview</text>
      
    </g><g>
