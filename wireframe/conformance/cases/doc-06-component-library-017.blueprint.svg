  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="768" height="568" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><g>
          <rect x="32" y="32" width="736" height="96" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" />
