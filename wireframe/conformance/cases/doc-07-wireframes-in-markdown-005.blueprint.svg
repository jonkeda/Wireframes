  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Quick Sketch"><text x="16" y="38.67" class="wire-text wire-text-bold" style="font-size: 20px">Quick Sketch</text></g><g role="textbox" aria-label="Search..." aria-placeholder="Search..."><g>
