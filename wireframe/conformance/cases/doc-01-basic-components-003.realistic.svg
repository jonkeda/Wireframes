  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="Plain text label"><text x="16" y="31" class="wire-text">Plain text label</text></g><g role="group" aria-label="**Bold label**"><text x="16" y="59" class="wire-text wire-text-bold">Bold label</text></g><g role="group" aria-label="*Italic label*"><text x="16" y="87" class="wire-text" font-style="italic">Italic label</text></g><g role="group" aria-label="Large Heading"><text x="16" y="124" class="wire-text wire-text-bold" style="font-size: 24px">Large Heading</text></g><g role="group" aria-label="Medium Heading"><text x="16" y="162.67" class="wire-text wire-text-bold" style="font-size: 20px">Medium Heading</text></g><g role="group" aria-label="Small Heading"><text x="16" y="202" class="wire-text wire-text-bold" style="font-size: 18px">Small Heading</text></g>
</svg>
