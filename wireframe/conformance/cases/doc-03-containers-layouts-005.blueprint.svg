<svg xmlns="http://www.w3.org/2000/svg" width="450" height="228" viewBox="0 0 450 228" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="button" aria-label="Top Left"><g opacity="1">
      <rect x="26" y="26" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="76" y="49" text-anchor="middle" class="wire-text" style="fill: #ffffff">Top Left</text>
    </g></g><g role="button" aria-label="Center"><g opacity="1">
      <rect x="176" y="96" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="226" y="119" text-anchor="middle" class="wire-text" style="fill: #ffffff">Center</text>
    </g></g><g role="button" aria-label="Bottom Right"><g opacity="1">
      <rect x="306" y="176" width="128" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="370" y="199" text-anchor="middle" class="wire-text" style="fill: #ffffff">Bottom Right</text>
    </g></g>
</svg>
