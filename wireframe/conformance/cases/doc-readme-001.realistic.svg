<svg xmlns="http://www.w3.org/2000/svg" width="152" height="68" viewBox="0 0 152 68" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="button" aria-label="Hello World"><g opacity="1">
      <rect x="16" y="16" width="120" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="76" y="39" text-anchor="middle" class="wire-text" style="fill: #212529">Hello World</text>
    </g></g>
</svg>
