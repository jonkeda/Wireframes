<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="button" aria-label="Save"><g opacity="1">
      <rect x="16" y="16" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="66" y="39" text-anchor="middle" class="wire-text" fill="#212529">Save</text>
    </g></g><g role="textbox" aria-label="Name" aria-placeholder="Name"><g>
      <rect x="16" y="60" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="83" class="wire-text wire-text-secondary">Name</text>
      
    </g></g><rect x="16" y="104" width="768" height="480" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
</svg>
