<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="768" height="568" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="**Login**"><text x="32" y="47" class="wire-text wire-text-bold">Login</text></g><g role="group" aria-label="Email:"><text x="32" y="83" class="wire-text">Email:</text></g><g role="textbox" aria-label="Enter your email" aria-required="true" aria-placeholder="Enter your email"><g>
      <rect x="32" y="104" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="127" class="wire-text wire-text-secondary">Enter your email</text>
      <text x="220" y="127" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Password:"><text x="32" y="171" class="wire-text">Password:</text></g><g role="textbox" aria-label="Enter password" aria-required="true" aria-placeholder="Enter password"><g>
      <rect x="32" y="192" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="215" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="215" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="32" y="247" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="58" y="261" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Sign In"><g opacity="1">
      <rect x="32" y="284" width="100" height="36" rx="4" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="307" text-anchor="middle" class="wire-text" fill="#ffffff">Sign In</text>
    </g></g><g role="group" aria-label="Forgot password?"><text x="32" y="351" class="wire-text">Forgot password?</text></g>
</svg>
