    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="true"><g><rect x="16" y="107" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><path d="M20 116 L24 120 L30 112" stroke="#0d6efd" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="42" y="121" class="wire-text">Remember me</text></g></g><g role="combobox" aria-expanded="false" aria-haspopup="listbox"><g>
      <rect x="16" y="136" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="159" class="wire-text">Option 1</text>
