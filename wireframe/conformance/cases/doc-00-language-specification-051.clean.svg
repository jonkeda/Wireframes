  <rect x="16" y="16" width="768" height="68" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" /><g role="group" aria-label="User Profile"><text x="32" y="47" class="wire-text wire-text-bold">User Profile</text></g><g role="button"><g><rect x="732" y="32" width="36" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" /><rect x="742" y="42" width="16" height="16" rx="2" fill="none" stroke="#212529" stroke-width="1" stroke-dasharray="2,2" /></g></g><rect x="16" y="84" width="768" height="500" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" /><rect x="32" y="100" width="736" height="244" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Personal Information"><text x="48" y="131" class="wire-text wire-text-bold">Personal Information</text></g><g role="group" aria-label="First Name"><text x="48" y="163" class="wire-text">First Name</text></g><g role="textbox" aria-label="John" aria-placeholder="John"><g>
