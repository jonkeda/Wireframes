<svg xmlns="http://www.w3.org/2000/svg" width="580" height="441" viewBox="0 0 580 441" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Toast Notifications"><text x="16" y="31" class="wire-text wire-text-bold">Toast Notifications</text></g><g role="alert" aria-label="This is an info message"><g>
      <rect x="16" y="52" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="52" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="85" class="wire-text">This is an info message</text>
      <path d="M311 75 L321 85 M321 75 L311 85" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="Operation completed successfully!"><g>
      <rect x="16" y="116" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="116" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="149" class="wire-text">Operation completed successfully!</text>
      <path d="M311 139 L321 149 M321 139 L311 149" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="Please check your input"><g>
      <rect x="16" y="180" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="180" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="213" class="wire-text">Please check your input</text>
      <path d="M311 203 L321 213 M321 203 L311 213" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="An error occurred"><g>
      <rect x="16" y="244" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="244" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="277" class="wire-text">An error occurred</text>
      <path d="M311 267 L321 277 M321 267 L311 277" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="group"><line x1="16" y1="316" x2="216" y2="316" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="Toast with Actions"><text x="16" y="348" class="wire-text wire-text-bold">Toast with Actions</text></g><g role="alert" aria-label="New update available"><g>
      <rect x="16" y="369" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="369" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="402" class="wire-text">New update available</text>
      <path d="M311 392 L321 402 M321 392 L311 402" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="button" aria-label="Update Now"><g opacity="1">
      <rect x="344" y="369" width="112" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="400" y="392" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Update Now</text>
    </g></g><g role="button" aria-label="Later"><g opacity="1">
      <rect x="464" y="369" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="514" y="392" text-anchor="middle" class="wire-text" style="fill: #ffffff">Later</text>
    </g></g>
