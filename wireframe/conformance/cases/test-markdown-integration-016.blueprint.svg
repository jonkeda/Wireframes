    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="768" height="568" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="Welcome to App"><text x="32" y="47" class="wire-text">Welcome to App</text></g><g role="textbox" aria-label="Enter email" aria-placeholder="Enter email"><g>
      <rect x="32" y="68" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="91" class="wire-text wire-text-secondary">Enter email</text>
      
    </g></g><g role="textbox" aria-label="Password" aria-placeholder="Password"><g>
