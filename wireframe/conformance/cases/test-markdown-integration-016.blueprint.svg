      <text x="44" y="143" class="wire-text wire-text-secondary">••••</text>
      
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="32" y="175" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="58" y="189" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Sign In"><g opacity="1">
      <rect x="32" y="212" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
