<svg xmlns="http://www.w3.org/2000/svg" width="232" height="88" viewBox="0 0 232 88" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="textbox" aria-label="Name" aria-required="true" aria-placeholder="e.g. Office"><g><text x="16" y="30" class="wire-text wire-text-small">Name</text>
      <rect x="16" y="36" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="28" y="59" class="wire-text wire-text-secondary">e.g. Office</text>
      <text x="204" y="59" text-anchor="end" fill="#dc3545">*</text>
    </g></g>
</svg>
