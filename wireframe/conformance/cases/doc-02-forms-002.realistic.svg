<svg xmlns="http://www.w3.org/2000/svg" width="232" height="164" viewBox="0 0 232 164" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="textbox" aria-label="Password" aria-placeholder="Password"><g>
      <rect x="16" y="16" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">••••</text>
      
    </g></g><g role="textbox" aria-label="Select date" aria-placeholder="Select date"><g>
      <rect x="16" y="64" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="87" class="wire-text wire-text-secondary">📅</text>
      
    </g></g><g role="spinbutton" aria-label="Enter number" aria-placeholder="Enter number"><g>
      <rect x="16" y="112" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="135" class="wire-text wire-text-secondary">123</text>
      
    </g></g>
</svg>
