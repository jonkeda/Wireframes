<svg xmlns="http://www.w3.org/2000/svg" width="232" height="88" viewBox="0 0 232 88" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="16" y="16" width="200" height="8" rx="4" fill="#2a4a6f" />
      <rect x="16" y="16" width="150" height="8" rx="4" fill="#ffffff" />
    </g></g><g role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="16" y="40" width="200" height="8" rx="4" fill="#2a4a6f" />
      <rect x="16" y="40" width="100" height="8" rx="4" fill="#ffffff" />
    </g></g><g role="progressbar" aria-valuenow="25" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="16" y="64" width="200" height="8" rx="4" fill="#2a4a6f" />
      <rect x="16" y="64" width="50" height="8" rx="4" fill="#ffffff" />
    </g></g>
</svg>
