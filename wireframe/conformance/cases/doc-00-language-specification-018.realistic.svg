<svg xmlns="http://www.w3.org/2000/svg" width="232" height="264" viewBox="0 0 232 264" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="textbox" aria-label="Placeholder text" aria-placeholder="Placeholder text"><g>
      <rect x="16" y="16" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">Placeholder text</text>
      
    </g></g><g role="textbox" aria-label="Username" aria-placeholder="Username"><g>
      <rect x="16" y="60" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="83" class="wire-text wire-text-secondary">Username</text>
      
    </g></g><g role="textbox" aria-label="Email" aria-required="true" aria-placeholder="Email"><g>
      <rect x="16" y="104" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="127" class="wire-text wire-text-secondary">Email</text>
      <text x="204" y="127" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Name" aria-placeholder="Name"><g>
      <rect x="16" y="148" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="171" class="wire-text wire-text-secondary">Name</text>
      
    </g></g><g role="textbox" aria-label="Name" aria-required="true" aria-placeholder="e.g. Jane"><g><text x="16" y="206" class="wire-text wire-text-small">Name</text>
      <rect x="16" y="212" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="235" class="wire-text wire-text-secondary">e.g. Jane</text>
      <text x="204" y="235" text-anchor="end" fill="#dc3545">*</text>
    </g></g>
</svg>
