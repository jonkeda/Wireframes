<svg xmlns="http://www.w3.org/2000/svg" width="800" height="68" viewBox="0 0 800 68" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="568" y="16" width="100" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="618" y="39" text-anchor="middle" class="wire-text" style="fill: #212529">Cancel</text>
    </g></g><g role="button" aria-label="Save"><g opacity="1">
      <rect x="684" y="16" width="100" height="36" rx="4" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="734" y="39" text-anchor="middle" class="wire-text" style="fill: #ffffff">Save</text>
    </g></g>
</svg>
