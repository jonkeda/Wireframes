    </g></g><g role="group" aria-label="React"><g>
      <rect x="192" y="16" width="80" height="28" rx="14" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="232" y="34" text-anchor="middle" class="wire-text wire-text-small" style="fill: #ffffff">React</text>
