<svg xmlns="http://www.w3.org/2000/svg" width="376" height="60" viewBox="0 0 376 60" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Technology"><g>
      <rect x="16" y="16" width="80" height="28" rx="14" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="56" y="34" text-anchor="middle" class="wire-text wire-text-small" style="fill: #ffffff">Technology</text>
    </g></g><g role="group" aria-label="Design"><g>
