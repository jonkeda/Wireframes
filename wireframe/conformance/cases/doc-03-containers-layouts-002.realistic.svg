    </g></g><g role="button" aria-label="Center"><g opacity="1">
      <rect x="124" y="16" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="174" y="39" text-anchor="middle" class="wire-text" fill="#212529">Center</text>
    </g></g><g role="button" aria-label="Right"><g opacity="1">
      <rect x="232" y="16" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="282" y="39" text-anchor="middle" class="wire-text" fill="#212529">Right</text>
    </g></g>
</svg>
