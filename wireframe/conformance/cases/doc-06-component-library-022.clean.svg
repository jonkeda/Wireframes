      <text x="28" y="39" class="wire-text wire-text-secondary">123</text>
      
    </g></g><g role="spinbutton" aria-label="Quantity" aria-placeholder="Quantity"><g>
      <rect x="16" y="60" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
