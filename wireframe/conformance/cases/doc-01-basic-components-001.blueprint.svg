<svg xmlns="http://www.w3.org/2000/svg" width="460" height="68" viewBox="0 0 460 68" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="button" aria-label="Click Me"><g opacity="1">
      <rect x="16" y="16" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="66" y="39" text-anchor="middle" class="wire-text" style="fill: #ffffff">Click Me</text>
    </g></g><g role="button" aria-label="Primary"><g opacity="1">
      <rect x="124" y="16" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="174" y="39" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Primary</text>
    </g></g><g role="button" aria-label="Secondary"><g opacity="1">
      <rect x="232" y="16" width="104" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="284" y="39" text-anchor="middle" class="wire-text" style="fill: #ffffff">Secondary</text>
    </g></g><g role="button" aria-label="Disabled" aria-disabled="true"><g opacity="0.5">
      <rect x="344" y="16" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="394" y="39" text-anchor="middle" class="wire-text" style="fill: #ffffff">Disabled</text>
    </g></g>
</svg>
