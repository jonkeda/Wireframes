<svg xmlns="http://www.w3.org/2000/svg" width="352" height="320" viewBox="0 0 352 320" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="320" height="288" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Login"><text x="32" y="54.67" class="wire-text wire-text-bold" style="font-size: 20px">Login</text></g><g role="textbox" aria-label="Email" aria-required="true" aria-placeholder="Email"><g>
      <rect x="32" y="72" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="95" class="wire-text wire-text-secondary">Email</text>
      <text x="220" y="95" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Password" aria-required="true" aria-placeholder="Password"><g>
      <rect x="32" y="124" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="147" class="wire-text wire-text-secondary">Password</text>
      <text x="220" y="147" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="32" y="179" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="58" y="193" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Sign In"><g opacity="1">
      <rect x="32" y="216" width="100" height="36" rx="4" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="239" text-anchor="middle" class="wire-text" style="fill: #ffffff">Sign In</text>
    </g></g><g role="link" aria-label="Forgot password?"><g>
      <text x="32" y="283" class="wire-text" style="fill: #0d6efd; text-decoration: underline">Forgot password?</text>
    </g></g>
</svg>
