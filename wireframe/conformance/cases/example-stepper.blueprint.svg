      <rect x="48" y="409" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="60" y="432" class="wire-text wire-text-secondary">123 Main St</text>
      
    </g></g><g role="group" aria-label="City:"><text x="48" y="468" class="wire-text">City:</text></g><g role="textbox" aria-label="New York" aria-placeholder="New York"><g>
      <rect x="48" y="477" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="60" y="500" class="wire-text wire-text-secondary">New York</text>
      
    </g></g><g role="group" aria-label="ZIP:"><text x="404" y="468" class="wire-text">ZIP:</text></g><g role="textbox" aria-label="10001" aria-placeholder="10001"><g>
