    </g></g><g role="group"><line x1="16" y1="613" x2="216" y2="613" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="**Completed Stepper**"><text x="16" y="645" class="wire-text wire-text-bold">Completed Stepper</text></g>
