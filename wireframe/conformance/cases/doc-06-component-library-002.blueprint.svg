<svg xmlns="http://www.w3.org/2000/svg" width="670" height="356" viewBox="0 0 670 356" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="button" aria-label="Span 2 columns"><g opacity="1">
      <rect x="16" y="16" width="144" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="88" y="39" text-anchor="middle" class="wire-text" fill="#ffffff">Span 2 columns</text>
    </g></g><g role="button" aria-label="Normal cell"><g opacity="1">
      <rect x="533.33" y="16" width="120" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="593.33" y="39" text-anchor="middle" class="wire-text" fill="#ffffff">Normal cell</text>
    </g></g><g role="button" aria-label="Span 2 rows"><g opacity="1">
      <rect x="16" y="304" width="120" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="76" y="327" text-anchor="middle" class="wire-text" fill="#ffffff">Span 2 rows</text>
    </g></g>
</svg>
