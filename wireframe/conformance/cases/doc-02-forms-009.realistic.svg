<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="768" height="568" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="Contact Form"><text x="32" y="54.67" class="wire-text wire-text-bold" style="font-size: 20px">Contact Form</text></g><g role="group" aria-label="Full Name"><text x="32" y="95" class="wire-text">Full Name</text></g><g role="textbox" aria-label="John Doe" aria-required="true" aria-placeholder="John Doe"><g>
      <rect x="32" y="104" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="127" class="wire-text wire-text-secondary">John Doe</text>
      <text x="220" y="127" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Email Address"><text x="32" y="171" class="wire-text">Email Address</text></g><g role="textbox" aria-label="john@example.com" aria-required="true" aria-placeholder="john@example.com"><g>
      <rect x="32" y="180" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="203" class="wire-text wire-text-secondary">john@example.com</text>
      <text x="220" y="203" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Subject"><text x="32" y="247" class="wire-text">Subject</text></g><g role="combobox" aria-label="Select a topic" aria-placeholder="Select a topic" aria-expanded="false" aria-haspopup="listbox"><g>
      <rect x="32" y="256" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="279" class="wire-text">General Inquiry</text>
      <path d="M212 272 L218 278 L224 272" stroke="#212529" stroke-width="2" fill="none" />
    </g></g><g role="group" aria-label="General Inquiry"><g>
      <rect x="32" y="292" width="100" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,2" />
      <text x="82" y="312" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Option</text>
    </g></g><g role="group" aria-label="Technical Support"><g>
      <rect x="32" y="330" width="100" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,2" />
      <text x="82" y="350" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Option</text>
    </g></g><g role="group" aria-label="Billing Question"><g>
      <rect x="32" y="368" width="100" height="30" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,2" />
      <text x="82" y="388" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Option</text>
    </g></g><g role="group" aria-label="Message"><text x="32" y="323" class="wire-text">Message</text></g><g role="textbox" aria-label="Your message here..." aria-placeholder="Your message here..."><g>
      <rect x="32" y="332" width="300" height="100" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="352" class="wire-text wire-text-secondary">Your message here...</text>
      <line x1="312" y1="424" x2="324" y2="424" stroke="#dee2e6" stroke-width="2" />
      <line x1="318" y1="418" x2="324" y2="424" stroke="#dee2e6" stroke-width="2" />
    </g></g><g role="checkbox" aria-label="Send me a copy of this message" aria-checked="false"><g><rect x="32" y="451" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="58" y="465" class="wire-text">Send me a copy of this message</text></g></g><g role="button" aria-label="Submit"><g opacity="1">
      <rect x="32" y="488" width="100" height="36" rx="6" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="511" text-anchor="middle" class="wire-text" fill="#ffffff">Submit</text>
    </g></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="140" y="488" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="190" y="511" text-anchor="middle" class="wire-text" fill="#212529">Cancel</text>
    </g></g>
</svg>
