      <rect x="16" y="104" width="104" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="68" y="127" text-anchor="middle" class="wire-text" fill="#212529">Secondary</text>
    </g></g><g role="button" aria-label="Disabled" aria-disabled="true"><g opacity="0.5">
