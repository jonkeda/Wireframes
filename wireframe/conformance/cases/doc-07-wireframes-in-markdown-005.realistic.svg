<svg xmlns="http://www.w3.org/2000/svg" width="800" height="208" viewBox="0 0 800 208" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="Quick Sketch"><text x="16" y="38.67" class="wire-text wire-text-bold" style="font-size: 20px">Quick Sketch</text></g><g role="textbox" aria-label="Search..." aria-placeholder="Search..."><g>
      <rect x="16" y="64" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="87" class="wire-text wire-text-secondary">Search...</text>
      
    </g></g><g role="button" aria-label="Add"><g opacity="1">
      <rect x="16" y="156" width="100" height="36" rx="6" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="66" y="179" text-anchor="middle" class="wire-text" fill="#ffffff">Add</text>
    </g></g><g role="button" aria-label="Remove"><g opacity="1">
      <rect x="124" y="156" width="100" height="36" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="174" y="179" text-anchor="middle" class="wire-text" fill="#212529">Remove</text>
    </g></g>
</svg>
