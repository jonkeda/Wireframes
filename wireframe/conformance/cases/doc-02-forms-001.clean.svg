<svg xmlns="http://www.w3.org/2000/svg" width="232" height="260" viewBox="0 0 232 260" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="textbox" aria-label="Enter your name" aria-placeholder="Enter your name"><g>
      <rect x="16" y="16" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">Enter your name</text>
      
    </g></g><g role="textbox" aria-label="Email" aria-required="true" aria-placeholder="Email"><g>
      <rect x="16" y="64" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="87" class="wire-text wire-text-secondary">Email</text>
      <text x="204" y="87" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="John Doe" aria-placeholder="John Doe"><g>
      <rect x="16" y="112" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="135" class="wire-text wire-text-secondary">John Doe</text>
      
    </g></g><g role="textbox" aria-label="Disabled" aria-disabled="true" aria-placeholder="Disabled"><g>
      <rect x="16" y="160" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="183" class="wire-text wire-text-secondary">Disabled</text>
      
    </g></g><g role="textbox" aria-label="Read only" aria-placeholder="Read only"><g>
      <rect x="16" y="208" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="231" class="wire-text wire-text-secondary">Read only</text>
      
    </g></g>
</svg>
