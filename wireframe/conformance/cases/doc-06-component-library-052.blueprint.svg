<svg xmlns="http://www.w3.org/2000/svg" width="800" height="128" viewBox="0 0 800 128" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g>
          <rect x="16" y="16" width="768" height="96" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" />
          <text x="32" y="40" class="wire-text wire-text-bold">Dialog Title</text>
        </g><g role="group" aria-label="Dialog content"><text x="32" y="47" class="wire-text">Dialog content</text></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="60" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="83" text-anchor="middle" class="wire-text" fill="#ffffff">Cancel</text>
    </g></g><g role="button" aria-label="OK"><g opacity="1">
      <rect x="140" y="60" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="190" y="83" text-anchor="middle" class="wire-text" fill="#1e3a5f">OK</text>
    </g></g>
</svg>
