<svg xmlns="http://www.w3.org/2000/svg" width="136" height="136" viewBox="0 0 136 136" role="img">
  <style>
    .wire-text { font-family: "Comic Sans MS", cursive, sans-serif; font-size: 14px; fill: #333333; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#fefefe" />
  <g role="group" aria-label="Plain text"><text x="16" y="31" class="wire-text">Plain text</text></g><g role="group" aria-label="**Bold text**"><text x="16" y="59" class="wire-text wire-text-bold">Bold text</text></g><g role="group" aria-label="*Italic text*"><text x="16" y="87" class="wire-text" font-style="italic">Italic text</text></g><g role="group" aria-label="`Code style`"><text x="16" y="115" class="wire-text">`Code style`</text></g>
</svg>
