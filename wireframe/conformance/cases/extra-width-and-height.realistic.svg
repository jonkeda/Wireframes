    </g></g><g role="textbox" aria-label="w wins" aria-placeholder="w wins"><g>
      <rect x="16" y="72" width="120" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="95" class="wire-text wire-text-secondary">w wins</text>
      
    </g></g><g role="img"><g>
