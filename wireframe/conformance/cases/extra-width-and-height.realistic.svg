  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="button" aria-label="Wide"><g opacity="1">
      <rect x="16" y="16" width="240" height="48" rx="6" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
