<svg xmlns="http://www.w3.org/2000/svg" width="132" height="100" viewBox="0 0 132 100" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Option text"><g>
      <rect x="16" y="16" width="100" height="30" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" stroke-dasharray="4,2" />
      <text x="66" y="36" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Option</text>
    </g></g><g role="group" aria-label="Selected option"><g>
      <rect x="16" y="54" width="100" height="30" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" stroke-dasharray="4,2" />
      <text x="66" y="74" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Option</text>
    </g></g>
</svg>
