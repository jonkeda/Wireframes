    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="480" height="308" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Settings"><text x="32" y="54.67" class="wire-text wire-text-bold" style="font-size: 20px">Settings</text></g><g role="textbox" aria-label="Display Name" aria-placeholder="Display Name"><g>
      <rect x="32" y="72" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="95" class="wire-text wire-text-secondary">Display Name</text>
      
    </g></g><g role="img"><g>
      <rect x="32" y="132" width="80" height="80" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
