      <line x1="112" y1="132" x2="32" y2="212" stroke="#dee2e6" stroke-width="1" />
      <text x="72" y="177" text-anchor="middle" class="wire-text wire-text-secondary wire-text-small">Image</text>
    </g></g><g role="switch" aria-label="Email notifications" aria-checked="true"><g><rect x="32" y="220" width="44" height="24" rx="12" fill="#0d6efd" /><circle cx="64" cy="232" r="10" fill="#ffffff" /><text x="84" y="237" class="wire-text">Email notifications</text></g></g><g role="switch" aria-label="Push notifications" aria-checked="false"><g><rect x="32" y="252" width="44" height="24" rx="12" fill="#dee2e6" /><circle cx="44" cy="264" r="10" fill="#ffffff" /><text x="84" y="269" class="wire-text">Push notifications</text></g></g><g role="switch" aria-label="Weekly digest" aria-checked="true"><g><rect x="32" y="284" width="44" height="24" rx="12" fill="#0d6efd" /><circle cx="64" cy="296" r="10" fill="#ffffff" /><text x="84" y="301" class="wire-text">Weekly digest</text></g></g><g role="button" aria-label="Cancel"><g opacity="1">
