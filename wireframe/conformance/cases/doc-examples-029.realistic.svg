<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="768" height="568" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="**Accessible Form Example**"><text x="32" y="47" class="wire-text wire-text-bold">Accessible Form Example</text></g><g role="group" aria-label="Email Address *"><text x="32" y="79" class="wire-text">Email Address *</text></g><g role="textbox" aria-label="Enter a valid email address" aria-required="true" aria-placeholder="Enter a valid email address"><g>
      <rect x="32" y="96" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="119" class="wire-text wire-text-secondary">Enter a valid email address</text>
      <text x="220" y="119" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Password *"><text x="32" y="159" class="wire-text">Password *</text></g><g role="textbox" aria-label="Minimum 8 characters" aria-required="true" aria-placeholder="Minimum 8 characters"><g>
      <rect x="32" y="176" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="199" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="199" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="button" aria-label="Submit"><g opacity="1">
      <rect x="32" y="224" width="100" height="36" rx="6" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="247" text-anchor="middle" class="wire-text" fill="#ffffff">Submit</text>
    </g></g>
</svg>
