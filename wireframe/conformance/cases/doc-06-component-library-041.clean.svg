<svg xmlns="http://www.w3.org/2000/svg" width="232" height="72" viewBox="0 0 232 72" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="progressbar" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="16" y="16" width="200" height="8" rx="4" fill="#f8f9fa" />
      <rect x="16" y="16" width="150" height="8" rx="4" fill="#0d6efd" />
    </g></g><g role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100"><g>
      <rect x="16" y="32" width="200" height="8" rx="4" fill="#f8f9fa" />
      <rect x="16" y="32" width="100" height="8" rx="4" fill="#0d6efd" />
    </g></g><g role="progressbar"><g>
      <rect x="16" y="48" width="200" height="8" rx="4" fill="#f8f9fa" />
      <rect x="16" y="48" width="0" height="8" rx="4" fill="#0d6efd" />
    </g></g>
</svg>
