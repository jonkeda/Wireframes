<svg xmlns="http://www.w3.org/2000/svg" width="232" height="188" viewBox="0 0 232 188" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="textbox" aria-label="Enter email" aria-placeholder="Enter email"><g>
      <rect x="16" y="16" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">Enter email</text>
      
    </g></g><g role="textbox" aria-label="Password" aria-placeholder="Password"><g>
      <rect x="16" y="60" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="28" y="83" class="wire-text wire-text-secondary">••••</text>
      
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="16" y="107" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="42" y="121" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Submit"><g opacity="1">
      <rect x="16" y="136" width="100" height="36" rx="6" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="66" y="159" text-anchor="middle" class="wire-text" fill="#ffffff">Submit</text>
    </g></g>
</svg>
