<svg xmlns="http://www.w3.org/2000/svg" width="352" height="280" viewBox="0 0 352 280" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="alert" aria-label="File saved successfully"><g>
      <rect x="16" y="16" width="320" height="56" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="16" width="4" height="56" rx="6 0 0 6" fill="#198754" />
      <text x="32" y="49" class="wire-text">File saved successfully</text>
      <path d="M311 39 L321 49 M321 39 L311 49" stroke="#6c757d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="New message received"><g>
      <rect x="16" y="80" width="320" height="56" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="80" width="4" height="56" rx="6 0 0 6" fill="#0dcaf0" />
      <text x="32" y="113" class="wire-text">New message received</text>
      <path d="M311 103 L321 113 M321 103 L311 113" stroke="#6c757d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="Network connection slow"><g>
      <rect x="16" y="144" width="320" height="56" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="144" width="4" height="56" rx="6 0 0 6" fill="#ffc107" />
      <text x="32" y="177" class="wire-text">Network connection slow</text>
      <path d="M311 167 L321 177 M321 167 L311 177" stroke="#6c757d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="Failed to upload file"><g>
      <rect x="16" y="208" width="320" height="56" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="208" width="4" height="56" rx="6 0 0 6" fill="#dc3545" />
      <text x="32" y="241" class="wire-text">Failed to upload file</text>
      <path d="M311 231 L321 241 M321 231 L311 241" stroke="#6c757d" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g>
</svg>
