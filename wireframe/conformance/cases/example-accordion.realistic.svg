      <text x="96" y="456" text-anchor="middle" class="wire-text" style="fill: #212529">Update Email</text>
    </g></g><g><rect x="16" y="485" width="768" height="40" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="485" width="768" height="40" fill="#f8f9fa" /><text x="32" y="510" class="wire-text wire-text-bold">Privacy Settings</text><path d="M756 507 L760 501 L764 507" stroke="#212529" stroke-width="2" fill="none" /></g>
