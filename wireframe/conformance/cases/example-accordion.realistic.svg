    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="FAQ Accordion"><text x="16" y="31" class="wire-text wire-text-bold">FAQ Accordion</text></g><g>
      <rect x="16" y="52" width="768" height="212" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
    </g><g><rect x="16" y="52" width="768" height="92" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="52" width="768" height="40" fill="#f8f9fa" /><text x="32" y="77" class="wire-text wire-text-bold">What is Wireframe DSL?</text><path d="M756 70 L760 76 L764 70" stroke="#212529" stroke-width="2" fill="none" /></g><g role="group" aria-label="Wireframe DSL is a domain-specific language for creating UI mockups using simple text-based syntax."><text x="32" y="123" class="wire-text">Wireframe DSL is a domain-specific language for creating UI mockups using simple text-based syntax.</text></g><g><rect x="16" y="144" width="768" height="40" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="144" width="768" height="40" fill="#f8f9fa" /><text x="32" y="169" class="wire-text wire-text-bold">How do I get started?</text><path d="M756 166 L760 160 L764 166" stroke="#212529" stroke-width="2" fill="none" /></g><g><rect x="16" y="184" width="768" height="40" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="184" width="768" height="40" fill="#f8f9fa" /><text x="32" y="209" class="wire-text wire-text-bold">Can I export to other formats?</text><path d="M756 206 L760 200 L764 206" stroke="#212529" stroke-width="2" fill="none" /></g><g><rect x="16" y="224" width="768" height="40" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="224" width="768" height="40" fill="#f8f9fa" /><text x="32" y="249" class="wire-text wire-text-bold">Is it free to use?</text><path d="M756 246 L760 240 L764 246" stroke="#212529" stroke-width="2" fill="none" /></g><g role="group"><line x1="16" y1="280" x2="216" y2="280" stroke="#dee2e6" stroke-width="1" /></g><g role="group" aria-label="Settings Accordion"><text x="16" y="312" class="wire-text wire-text-bold">Settings Accordion</text></g><g>
      <rect x="16" y="333" width="768" height="192" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
    </g><g><rect x="16" y="333" width="768" height="152" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><rect x="16" y="333" width="768" height="40" fill="#f8f9fa" /><text x="32" y="358" class="wire-text wire-text-bold">Account Settings</text><path d="M756 351 L760 357 L764 351" stroke="#212529" stroke-width="2" fill="none" /></g><g role="textbox" aria-label="john@example.com" aria-placeholder="john@example.com"><g>
      <rect x="32" y="389" width="200" height="36" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
