<svg xmlns="http://www.w3.org/2000/svg" width="800" height="336" viewBox="0 0 800 336" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="768" height="304" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Login"><text x="32" y="47" class="wire-text wire-text-bold">Login</text></g><g role="group" aria-label="Username:"><text x="32" y="83" class="wire-text">Username:</text></g><g role="textbox" aria-label="Enter username" aria-required="true" aria-placeholder="Enter username"><g>
      <rect x="32" y="96" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="119" class="wire-text wire-text-secondary">Enter username</text>
      <text x="220" y="119" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Password:"><text x="32" y="163" class="wire-text">Password:</text></g><g role="textbox" aria-label="Enter password" aria-required="true" aria-placeholder="Enter password"><g>
      <rect x="32" y="176" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="199" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="199" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="32" y="231" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="58" y="245" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="560" y="268" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="610" y="291" text-anchor="middle" class="wire-text" style="fill: #ffffff">Cancel</text>
    </g></g><g role="button" aria-label="Login"><g opacity="1">
      <rect x="668" y="268" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="718" y="291" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Login</text>
    </g></g>
</svg>
