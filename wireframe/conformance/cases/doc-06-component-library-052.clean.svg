<svg xmlns="http://www.w3.org/2000/svg" width="800" height="156" viewBox="0 0 800 156" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g>
          <rect x="16" y="16" width="768" height="124" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
          <text x="32" y="40" class="wire-text wire-text-bold">Dialog Title</text>
        </g><g role="group" aria-label="Dialog content"><text x="32" y="75" class="wire-text">Dialog content</text></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="88" width="100" height="36" rx="4" fill="#e9ecef" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="111" text-anchor="middle" class="wire-text" style="fill: #212529">Cancel</text>
    </g></g><g role="button" aria-label="OK"><g opacity="1">
      <rect x="140" y="88" width="100" height="36" rx="4" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
