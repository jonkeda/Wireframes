<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="300" height="80" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><text x="32" y="40" class="wire-text wire-text-bold">First</text><g role="group" aria-label="one"><text x="32" y="75" class="wire-text">one</text></g><rect x="16" y="104" width="768" height="52" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="as high as its content"><text x="32" y="135" class="wire-text">as high as its content</text></g><rect x="16" y="164" width="260" height="120" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="32" y="188" class="wire-text wire-text-bold">A panel</text><g role="group" aria-label="three"><text x="32" y="223" class="wire-text">three</text></g>
</svg>
