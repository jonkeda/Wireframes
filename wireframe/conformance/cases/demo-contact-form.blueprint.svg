    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="768" height="648" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Get in Touch"><text x="32" y="47" class="wire-text wire-text-bold">Get in Touch</text></g><g role="group" aria-label="We&apos;d love to hear from you. Send us a message!"><text x="32" y="75" class="wire-text">We&apos;d love to hear from you. Send us a message!</text></g><g role="group" aria-label="First Name:"><text x="32" y="119" class="wire-text">First Name:</text></g><g role="textbox" aria-label="John" aria-required="true" aria-placeholder="John"><g>
