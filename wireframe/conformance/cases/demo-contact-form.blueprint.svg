    </g></g><g role="group" aria-label="Message:"><text x="32" y="439" class="wire-text">Message:</text></g><g role="textbox" aria-label="Tell us what&apos;s on your mind..." aria-required="true" aria-placeholder="Tell us what&apos;s on your mind..."><g>
