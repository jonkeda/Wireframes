    </g></g><g role="group" aria-label="Email Address:"><text x="32" y="199" class="wire-text">Email Address:</text></g><g role="textbox" aria-label="john@example.com" aria-required="true" aria-placeholder="john@example.com"><g>
      <rect x="32" y="208" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="231" class="wire-text wire-text-secondary">john@example.com</text>
      <text x="220" y="231" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Phone Number:"><text x="32" y="279" class="wire-text">Phone Number:</text></g><g role="textbox" aria-label="+1 (555) 123-4567" aria-placeholder="+1 (555) 123-4567"><g>
