  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="300" height="196" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Login"><text x="32" y="54.67" class="wire-text wire-text-bold" style="font-size: 20px">Login</text></g><g role="textbox" aria-label="Email" aria-placeholder="Email"><g>
      <rect x="32" y="72" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
