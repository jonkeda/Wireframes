<svg xmlns="http://www.w3.org/2000/svg" width="800" height="128" viewBox="0 0 800 128" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#ffffff" />
  <g role="group" aria-label="Bold label"><text x="16" y="31" class="wire-text">**Bold** label</text></g><g role="link" aria-label="A link"><g>
      <text x="16" y="59" class="wire-text" style="fill: #0d6efd; text-decoration: underline">A link</text>
    </g></g><rect x="16" y="72" width="768" height="40" fill="none" stroke="#dee2e6" stroke-width="1" /><g>
      <rect x="16" y="72" width="768" height="40" fill="#f8f9fa" />
      <line x1="16" y1="112" x2="784" y2="112" stroke="#dee2e6" stroke-width="1" />
    </g><g>
      <rect x="16" y="72" width="80" height="40" fill="#ffffff" />
      <text x="56" y="97" text-anchor="middle" class="wire-text" style="fill: #0d6efd">On</text>
      <rect x="16" y="110" width="80" height="2" fill="#0d6efd" />
    </g><g>
      <rect x="96" y="72" width="80" height="40" fill="transparent" />
      <text x="136" y="97" text-anchor="middle" class="wire-text" style="fill: #6c757d">Off</text>
      
    </g>
</svg>
