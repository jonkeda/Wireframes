<svg xmlns="http://www.w3.org/2000/svg" width="382" height="316" viewBox="0 0 382 316" role="img">
  <style>
    .wire-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #212529; }
    .wire-text-secondary { fill: #6c757d; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#ffffff" />
  <rect x="16" y="16" width="350" height="284" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Welcome to App"><text x="32" y="47" class="wire-text">Welcome to App</text></g><g role="textbox" aria-label="Enter email" aria-placeholder="Enter email"><g>
      <rect x="32" y="68" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="91" class="wire-text wire-text-secondary">Enter email</text>
      
    </g></g><g role="textbox" aria-label="Password" aria-placeholder="Password"><g>
      <rect x="32" y="120" width="200" height="36" rx="4" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
      <text x="44" y="143" class="wire-text wire-text-secondary">••••</text>
      
    </g></g><g role="checkbox" aria-label="Remember me" aria-checked="false"><g><rect x="32" y="175" width="18" height="18" rx="2" fill="#ffffff" stroke="#dee2e6" stroke-width="1" /><text x="58" y="189" class="wire-text">Remember me</text></g></g><g role="button" aria-label="Sign In"><g opacity="1">
      <rect x="32" y="212" width="100" height="36" rx="4" fill="#0d6efd" stroke="#dee2e6" stroke-width="1" />
      <text x="82" y="235" text-anchor="middle" class="wire-text" style="fill: #ffffff">Sign In</text>
    </g></g><g role="link" aria-label="Forgot password?"><g>
      <text x="32" y="279" class="wire-text" style="fill: #0d6efd; text-decoration: underline">Forgot password?</text>
    </g></g>
</svg>
