<svg xmlns="http://www.w3.org/2000/svg" width="352" height="152" viewBox="0 0 352 152" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="alert" aria-label="Operation successful"><g>
      <rect x="16" y="16" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="16" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="49" class="wire-text">Operation successful</text>
      <path d="M311 39 L321 49 M321 39 L311 49" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g><g role="alert" aria-label="Error occurred"><g>
      <rect x="16" y="80" width="320" height="56" rx="4" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" />
      <rect x="16" y="80" width="4" height="56" rx="4 0 0 4" fill="#0dcaf0" />
      <text x="32" y="113" class="wire-text">Error occurred</text>
      <path d="M311 103 L321 113 M321 103 L311 113" stroke="#a0c4e8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g></g>
</svg>
