<svg xmlns="http://www.w3.org/2000/svg" width="432" height="292" viewBox="0 0 432 292" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  <defs><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.15" /></filter></defs>
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <rect x="16" y="16" width="400" height="260" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" filter="url(#shadow)" /><g role="group" aria-label="Accessible Form Example"><text x="32" y="47" class="wire-text wire-text-bold">Accessible Form Example</text></g><g role="group" aria-label="Email Address *"><text x="32" y="79" class="wire-text">Email Address *</text></g><g role="textbox" aria-label="Enter a valid email address" aria-required="true" aria-placeholder="Enter a valid email address"><g>
      <rect x="32" y="96" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="119" class="wire-text wire-text-secondary">Enter a valid email address</text>
      <text x="220" y="119" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="group" aria-label="Password *"><text x="32" y="159" class="wire-text">Password *</text></g><g role="textbox" aria-label="Minimum 8 characters" aria-required="true" aria-placeholder="Minimum 8 characters"><g>
      <rect x="32" y="176" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="199" class="wire-text wire-text-secondary">••••</text>
      <text x="220" y="199" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="button" aria-label="Submit"><g opacity="1">
      <rect x="32" y="224" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="247" text-anchor="middle" class="wire-text" style="fill: #1e3a5f">Submit</text>
    </g></g>
</svg>
