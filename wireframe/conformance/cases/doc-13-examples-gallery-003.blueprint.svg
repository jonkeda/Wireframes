<svg xmlns="http://www.w3.org/2000/svg" width="232" height="212" viewBox="0 0 232 212" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="textbox" aria-label="Username" aria-required="true" aria-placeholder="Username"><g>
      <rect x="16" y="16" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="28" y="39" class="wire-text wire-text-secondary">Username</text>
      <text x="204" y="39" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Email" aria-placeholder="Email"><g>
      <rect x="16" y="64" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="28" y="87" class="wire-text wire-text-secondary">Email</text>
      
    </g></g><g role="textbox" aria-label="Password" aria-placeholder="Password"><g>
      <rect x="16" y="112" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="28" y="135" class="wire-text wire-text-secondary">Password</text>
      
    </g></g><g role="textbox" aria-label="Disabled" aria-disabled="true" aria-placeholder="Disabled"><g>
      <rect x="16" y="160" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="28" y="183" class="wire-text wire-text-secondary">Disabled</text>
      
    </g></g>
</svg>
