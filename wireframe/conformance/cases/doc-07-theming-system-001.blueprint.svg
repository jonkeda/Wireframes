<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="Clean Theme"><text x="16" y="40" class="wire-text wire-text-bold" style="font-size: 24px">Clean Theme</text></g><g role="button" aria-label="Primary"><g opacity="1">
      <rect x="16" y="64" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="66" y="87" text-anchor="middle" class="wire-text" fill="#1e3a5f">Primary</text>
    </g></g><g role="button" aria-label="Secondary"><g opacity="1">
      <rect x="124" y="64" width="104" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="176" y="87" text-anchor="middle" class="wire-text" fill="#ffffff">Secondary</text>
    </g></g><g role="button" aria-label="Default"><g opacity="1">
      <rect x="236" y="64" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="286" y="87" text-anchor="middle" class="wire-text" fill="#ffffff">Default</text>
    </g></g><g role="button" aria-label="Disabled" aria-disabled="true"><g opacity="0.5">
      <rect x="344" y="64" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="394" y="87" text-anchor="middle" class="wire-text" fill="#ffffff">Disabled</text>
    </g></g><rect x="16" y="116" width="768" height="468" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1"  filter="url(#shadow)" /><g role="group" aria-label="Form Example"><text x="32" y="154.67" class="wire-text wire-text-bold" style="font-size: 20px">Form Example</text></g><g role="textbox" aria-label="Name" aria-required="true" aria-placeholder="Name"><g>
      <rect x="32" y="172" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="195" class="wire-text wire-text-secondary">Name</text>
      <text x="220" y="195" text-anchor="end" fill="#dc3545">*</text>
    </g></g><g role="textbox" aria-label="Email" aria-placeholder="Email"><g>
      <rect x="32" y="216" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="239" class="wire-text wire-text-secondary">Email</text>
      
    </g></g><g role="checkbox" aria-label="Subscribe" aria-checked="true"><g><rect x="32" y="263" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><path d="M36 272 L40 276 L46 268" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="58" y="277" class="wire-text">Subscribe</text></g></g><g role="button" aria-label="Submit"><g opacity="1">
      <rect x="32" y="292" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="315" text-anchor="middle" class="wire-text" fill="#1e3a5f">Submit</text>
    </g></g>
</svg>
