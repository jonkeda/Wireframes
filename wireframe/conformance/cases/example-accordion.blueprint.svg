<svg xmlns="http://www.w3.org/2000/svg" width="800" height="641" viewBox="0 0 800 641" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="**FAQ Accordion**"><text x="16" y="31" class="wire-text wire-text-bold">FAQ Accordion</text></g><g role="group" aria-label="Wireframe DSL is a domain-specific language for creating UI mockups using simple text-based syntax."><text x="48" y="99" class="wire-text">Wireframe DSL is a domain-specific language for creating UI mockups using simple text-based syntax.</text></g><g role="group" aria-label="Install the VS Code extension and create a new .wire file to begin designing your UI."><text x="48" y="159" class="wire-text">Install the VS Code extension and create a new .wire file to begin designing your UI.</text></g><g role="group" aria-label="Yes, you can export your wireframes to SVG, PNG, and other image formats."><text x="48" y="219" class="wire-text">Yes, you can export your wireframes to SVG, PNG, and other image formats.</text></g><g role="group" aria-label="Yes, Wireframe DSL is open source and free to use for any purpose."><text x="48" y="279" class="wire-text">Yes, Wireframe DSL is open source and free to use for any purpose.</text></g><g role="group"><line x1="16" y1="332" x2="216" y2="332" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="**Settings Accordion**"><text x="16" y="364" class="wire-text wire-text-bold">Settings Accordion</text></g><g role="textbox" aria-label="john@example.com" aria-placeholder="john@example.com"><g>
      <rect x="48" y="417" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="60" y="440" class="wire-text wire-text-secondary">john@example.com</text>
      
    </g></g><g role="button" aria-label="Update Email"><g opacity="1">
      <rect x="48" y="461" width="128" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="112" y="484" text-anchor="middle" class="wire-text" fill="#ffffff">Update Email</text>
    </g></g><g role="checkbox" aria-label="Make profile public" aria-checked="false"><g><rect x="48" y="540" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="74" y="554" class="wire-text">Make profile public</text></g></g><g role="checkbox" aria-label="Show email address" aria-checked="false"><g><rect x="48" y="572" width="18" height="18" rx="2" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><text x="74" y="586" class="wire-text">Show email address</text></g></g>
</svg>
