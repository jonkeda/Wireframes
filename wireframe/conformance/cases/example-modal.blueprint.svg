<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1222" viewBox="0 0 800 1222" role="img">
  <style>
    .wire-text { font-family: "Courier New", monospace; font-size: 14px; fill: #ffffff; }
    .wire-text-secondary { fill: #a0c4e8; }
    .wire-text-disabled { fill: #adb5bd; }
    .wire-text-bold { font-weight: 600; }
    .wire-text-small { font-size: 12px; }
    .wire-text-large { font-size: 18px; }
  </style>
  
  <rect width="100%" height="100%" fill="#1e3a5f" />
  <g role="group" aria-label="**Modal**"><text x="16" y="31" class="wire-text wire-text-bold">Modal</text></g><rect x="16" y="52" width="768" height="532" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" /><g role="group" aria-label="Are you sure you want to proceed?"><text x="32" y="83" class="wire-text">Are you sure you want to proceed?</text></g><g role="group" aria-label="This action cannot be undone."><text x="32" y="119" class="wire-text">This action cannot be undone.</text></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="140" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="163" text-anchor="middle" class="wire-text" fill="#ffffff">Cancel</text>
    </g></g><g role="button" aria-label="Confirm"><g opacity="1">
      <rect x="140" y="140" width="100" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="190" y="163" text-anchor="middle" class="wire-text" fill="#1e3a5f">Confirm</text>
    </g></g><g role="group"><line x1="16" y1="600" x2="216" y2="600" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="**Dialog**"><text x="16" y="632" class="wire-text wire-text-bold">Dialog</text></g><g>
          <rect x="16" y="653" width="768" height="360" rx="8" fill="#1e3a5f" stroke="#4a7ab0" stroke-width="1" />
          
        </g><g role="group" aria-label="Name:"><text x="32" y="684" class="wire-text">Name:</text></g><g role="textbox" aria-label="John Doe" aria-placeholder="John Doe"><g>
      <rect x="32" y="693" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="716" class="wire-text wire-text-secondary">John Doe</text>
      
    </g></g><g role="group" aria-label="Email:"><text x="32" y="760" class="wire-text">Email:</text></g><g role="textbox" aria-label="john@example.com" aria-placeholder="john@example.com"><g>
      <rect x="32" y="769" width="200" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="792" class="wire-text wire-text-secondary">john@example.com</text>
      
    </g></g><g role="group" aria-label="Bio:"><text x="32" y="836" class="wire-text">Bio:</text></g><g role="textbox" aria-label="A short bio..." aria-placeholder="A short bio..."><g>
      <rect x="32" y="845" width="300" height="100" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="44" y="865" class="wire-text wire-text-secondary">A short bio...</text>
      <line x1="312" y1="937" x2="324" y2="937" stroke="#4a7ab0" stroke-width="2" />
      <line x1="318" y1="931" x2="324" y2="937" stroke="#4a7ab0" stroke-width="2" />
    </g></g><g role="button" aria-label="Cancel"><g opacity="1">
      <rect x="32" y="961" width="100" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="82" y="984" text-anchor="middle" class="wire-text" fill="#ffffff">Cancel</text>
    </g></g><g role="button" aria-label="Save Changes"><g opacity="1">
      <rect x="140" y="961" width="128" height="36" rx="4" fill="#ffffff" stroke="#4a7ab0" stroke-width="1" />
      <text x="204" y="984" text-anchor="middle" class="wire-text" fill="#1e3a5f">Save Changes</text>
    </g></g><g role="group"><line x1="16" y1="1029" x2="216" y2="1029" stroke="#4a7ab0" stroke-width="1" /></g><g role="group" aria-label="**Alert**"><text x="16" y="1061" class="wire-text wire-text-bold">Alert</text></g><g>
          <rect x="16" y="1082" width="768" height="124" rx="4" fill="#ffc10720" stroke="#ffc107" stroke-width="1" />
          <rect x="16" y="1082" width="4" height="124" fill="#ffc107" />
        </g><g role="group" aria-label="**Warning**"><text x="32" y="1113" class="wire-text wire-text-bold">Warning</text></g><g role="group" aria-label="Your session will expire in 5 minutes."><text x="32" y="1141" class="wire-text">Your session will expire in 5 minutes.</text></g><g role="button" aria-label="Extend Session"><g opacity="1">
      <rect x="32" y="1154" width="144" height="36" rx="4" fill="#2a4a6f" stroke="#4a7ab0" stroke-width="1" />
      <text x="104" y="1177" text-anchor="middle" class="wire-text" fill="#ffffff">Extend Session</text>
    </g></g>
</svg>
